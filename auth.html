<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskHero — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:    #287052;
      --primary-hov:#1d5a40;
      --surface:    #f0f4ef;
      --bg:         #f6f8f5;
      --card:       #ffffff;
      --border:     #dfe6de;
      --text:       #202a23;
      --text-sub:   #647168;
      --danger:     #dc2626;
      --shadow:     0 2px 8px rgba(0,0,0,0.1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60%  { transform: translateX(-5px); }
      40%, 80%  { transform: translateX(5px); }
    }

    /* ── LAYOUT ────────────────────────────────────────── */
    .auth-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── CARD ──────────────────────────────────────────── */
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border-radius: 12px;
      padding: 36px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeUp 0.2s ease both;
    }

    /* Logo */
    .card-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 24px;
    }
    .card-logo-icon {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: var(--primary);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      color: white;
    }

    /* Heading */
    .card-heading {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .card-subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Fields */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .field-group.hidden { display: none; }

    .field-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .field-wrap { position: relative; }

    .field-wrap input {
      width: 100%;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      height: 42px;
    }
    .field-wrap input::placeholder { color: #aaaabc; }
    .field-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(40,112,82,0.12);
    }
    .field-wrap input.has-toggle { padding-right: 44px; }

    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      color: var(--text-sub);
      transition: color 0.15s;
    }
    .pw-toggle:hover { color: var(--primary); }

    .field-error {
      font-size: 12px;
      color: var(--danger);
      min-height: 16px;
      display: none;
    }
    .field-error.visible { display: block; }

    .auth-error {
      min-height: 20px;
      font-size: 13px;
      color: var(--danger);
      margin-bottom: 12px;
      display: none;
      line-height: 1.4;
    }
    .auth-error.visible { display: block; }
    .auth-error.shake   { animation: shake 0.35s ease; }

    /* Submit */
    .submit-btn {
      width: 100%;
      padding: 0 18px;
      height: 42px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 18px;
    }
    .submit-btn:hover:not(:disabled) { background: var(--primary-hov); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Switch */
    .auth-switch {
      text-align: center;
      font-size: 13px;
      color: var(--text-sub);
    }
    .auth-switch button {
      background: none;
      border: none;
      color: var(--primary);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }
    .auth-switch button:hover { text-decoration: underline; }

    /* ── DARK MODE ─────────────────────────────────────── */
    body.dark-mode {
      --bg:      #0f0f13;
      --card:    #18181f;
      --border:  #2a2a35;
      --text:    #f0f0f5;
      --text-sub:#8888a0;
      --surface: #1e1e28;
      background: var(--bg);
    }
    body.dark-mode .auth-card {
      background: var(--card);
      border-color: var(--border);
    }
    body.dark-mode .card-logo,
    body.dark-mode .card-heading { color: var(--text); }
    body.dark-mode .card-subtitle { color: var(--text-sub); }
    body.dark-mode .field-group label { color: var(--text); }
    body.dark-mode .field-wrap input {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }
    body.dark-mode .field-wrap input::placeholder { color: #555568; }
    body.dark-mode .auth-switch { color: var(--text-sub); }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="auth-shell" id="authShell">
    <section class="auth-card" aria-labelledby="authHeading" role="main">

      <!-- Logo -->
      <div class="card-logo">
        <span class="card-logo-icon" aria-hidden="true">T</span>
        TaskHero
      </div>

      <!-- Heading -->
      <h1 class="card-heading" id="authHeading">Welcome back</h1>
      <p class="card-subtitle" id="authSubtitle">Sign in to manage your tasks and connect with others.</p>

      <!-- Form -->
      <form class="auth-form" id="authForm" novalidate>

        <!-- Full Name (signup only) -->
        <div class="field-group hidden" id="nameField">
          <label for="nameInput">Full Name</label>
          <div class="field-wrap">
            <input type="text" id="nameInput" name="name" autocomplete="name" placeholder="Maria Santos" aria-describedby="nameError" />
          </div>
          <span class="field-error" id="nameError" role="alert" aria-live="polite"></span>
        </div>

        <!-- Email -->
        <div class="field-group" id="emailField">
          <label for="emailInput">Email address</label>
          <div class="field-wrap">
            <input type="email" id="emailInput" name="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="emailError" />
          </div>
          <span class="field-error" id="emailError" role="alert" aria-live="polite"></span>
        </div>

        <!-- Password -->
        <div class="field-group" id="passwordField">
          <label for="passwordInput">Password</label>
          <div class="field-wrap">
            <input type="password" id="passwordInput" name="password" autocomplete="current-password" placeholder="Min. 6 characters" required minlength="6" class="has-toggle" aria-describedby="passwordError" />
            <button type="button" class="pw-toggle" id="pwToggle1" aria-label="Show password">Show</button>
          </div>
          <span class="field-error" id="passwordError" role="alert" aria-live="polite"></span>
        </div>

        <!-- Confirm Password (signup only) -->
        <div class="field-group hidden" id="confirmField">
          <label for="confirmInput">Confirm Password</label>
          <div class="field-wrap">
            <input type="password" id="confirmInput" name="confirmPassword" autocomplete="new-password" placeholder="Repeat your password" class="has-toggle" aria-describedby="confirmError" />
            <button type="button" class="pw-toggle" id="pwToggle2" aria-label="Show confirm password">Show</button>
          </div>
          <span class="field-error" id="confirmError" role="alert" aria-live="polite"></span>
        </div>

        <!-- Global error -->
        <div class="auth-error" id="authError" role="alert" aria-live="assertive"></div>

        <!-- Submit -->
        <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>

      </form>

      <!-- Switch mode -->
      <p class="auth-switch" id="switchLine">
        Don't have an account?
        <button type="button" id="switchBtn">Create account</button>
      </p>

    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
