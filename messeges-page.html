<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskHero - Messages</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
.messages-layout {
    height: calc(100vh - 56px);
    display: grid;
    grid-template-columns: 300px 1fr;
}

/* ── LEFT PANEL ──────────────────────────────────────── */
.convo-panel {
    border-right: 1px solid var(--border);
    background: var(--card);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.convo-header {
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.convo-header h1 { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
.convo-header p  { color: var(--text-sub); font-size: 12px; }

.convo-search { padding: 10px 12px; flex-shrink: 0; }
.convo-search input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    background: var(--surface);
    font-family: inherit;
    transition: border-color 0.15s;
    color: var(--text);
    height: auto;
    box-shadow: none;
}
.convo-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(91,75,248,0.1); }

.user-search { padding: 0 12px 8px; }
.user-search input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    outline: none;
    height: auto;
    box-shadow: none;
}
.user-search input:focus { border-color: var(--primary); }

.user-results { max-height: 160px; overflow-y: auto; padding: 0 12px 6px; }
.user-result {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 0;
    border: 0;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    text-align: left;
    font: inherit;
    cursor: pointer;
    transition: color 0.12s;
}
.user-result:hover { color: var(--primary); }
.user-result-avatar {
    display: grid;
    place-items: center;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
}
.user-result-name { font-size: 13px; font-weight: 600; }
.user-result-email { display: block; color: var(--text-sub); font-size: 11px; }

.convo-list { flex: 1; overflow-y: auto; }

/* Conversation items */
.convo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.1s;
}
.convo-item:hover { background: var(--surface); }
.convo-item.active {
    background: var(--surface);
    border-left-color: var(--primary);
}

.avatar {
    width: 40px; height: 40px; min-width: 40px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-weight: 700;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}
.avatar .online-dot {
    position: absolute;
    bottom: 1px; right: 1px;
    width: 10px; height: 10px;
    background: var(--success);
    border-radius: 50%;
    border: 2px solid var(--card);
}

.convo-meta { flex: 1; min-width: 0; }
.convo-top { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 2px; }
.convo-name { font-weight: 600; font-size: 14px; }
.convo-time { font-size: 11px; color: var(--text-sub); }
.convo-preview { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.unread-badge {
    min-width: 18px; height: 18px;
    padding: 0 5px;
    background: var(--primary);
    color: white;
    font-size: 10px;
    font-weight: 700;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ── RIGHT PANEL ─────────────────────────────────────── */
.chat-panel {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
}
.chat-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-sub);
    gap: 8px;
}

/* Chat header */
.chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.chat-user-info h2 { font-size: 15px; font-weight: 600; margin-bottom: 1px; }
.online-label { font-size: 12px; color: var(--success); font-weight: 500; }
.chat-header-actions { margin-left: auto; display: flex; gap: 6px; }
.chat-action-btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    transition: border-color 0.15s, color 0.15s;
}
.chat-action-btn:hover { border-color: var(--primary); color: var(--primary); }

/* Task banner */
.task-banner {
    margin: 10px 16px 0;
    padding: 9px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}
.task-banner-info .task-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-sub); }
.task-banner-info .task-name  { font-size: 13px; font-weight: 600; color: var(--text); }

/* Messages */
.chat-messages {
    flex: 1;
    padding: 16px 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.date-separator {
    text-align: center;
    font-size: 11px;
    color: var(--text-sub);
    margin: 6px 0;
    font-weight: 500;
    position: relative;
}
.date-separator::before,
.date-separator::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 38%;
    height: 1px;
    background: var(--border);
}
.date-separator::before { left: 0; }
.date-separator::after  { right: 0; }

/* Bubbles */
.message {
    max-width: 60%;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
    border-radius: 16px;
}
.message.received {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px 16px 16px 4px;
    color: var(--text);
    box-shadow: var(--shadow-sm);
}
.message.sent {
    align-self: flex-end;
    background: var(--primary);
    color: white;
    border-radius: 16px 16px 4px 16px;
}
.message-row { display: flex; align-items: center; gap: 6px; }
.message-row.sent { justify-content: flex-end; }
.message-delete {
    border: 0; background: transparent; color: var(--text-sub); cursor: pointer;
    font-size: 14px; padding: 4px; opacity: 0; transition: opacity .15s;
}
.message-row:hover .message-delete { opacity: 1; }
.message-stack { max-width: min(88%, 520px); min-width: 0; }
.message-stack .message { max-width: 100%; white-space: pre-wrap; user-select: text; }
.message-reactions, .reaction-picker { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.message-reactions button, .reaction-picker button, .paste-btn {
    min-height: 44px; padding: 6px 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text); cursor: pointer;
    font: inherit; font-size: 12px;
}
.reaction-picker button { min-width: 44px; font-size: 20px; }
.message-reactions button[aria-pressed="true"] { border-color: var(--primary); background: var(--surface); }
.message-stack { position: relative; }
.message-more { position: absolute; top: 4px; right: -34px; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: var(--card); color: var(--text-sub); font-size: 22px; cursor: pointer; opacity: 0; }
.message-row.sent .message-more { right: auto; left: -34px; }
.message-more:focus-visible, .message-row:hover .message-more { opacity: 1; }
.message-context-menu { position: fixed; z-index: 2500; width: min(288px, calc(100vw - 24px)); padding: 8px; border: 1px solid var(--border); border-radius: 18px; background: var(--card); color: var(--text); box-shadow: 0 8px 32px rgba(0,0,0,.2); }
.message-context-menu[hidden] { display: none; }
.message-context-menu .reaction-picker { flex-wrap: nowrap; margin: 0 0 6px; gap: 0; }
.message-context-menu .reaction-picker button { flex: 1; min-width: 0; min-height: 44px; padding: 4px; border: 0; border-radius: 50%; background: transparent; }
.message-menu-action { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; color: var(--text); text-align: left; font: inherit; cursor: pointer; }
.message-menu-action:hover, .message-menu-action:focus-visible, .reaction-picker button:hover { background: var(--surface); }
.message-menu-delete { color: var(--danger); }
@media (hover: none) {
    .message-more { display: none; }
    .message-stack .message { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
}
.msg-input { resize: none; max-height: 100px; }
.msg-form { flex-wrap: wrap; }
.msg-input { flex-basis: 60%; }
.paste-btn { padding: 6px; }
.msg-time { display: block; font-size: 10px; margin-top: 4px; opacity: 0.55; }

/* Typing */
.typing-indicator {
    display: none;
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px 16px 16px 4px;
    padding: 10px 14px;
    gap: 4px;
    box-shadow: var(--shadow-sm);
}
.typing-indicator.show { display: flex; align-items: center; }
.typing-dot { width: 6px; height: 6px; background: var(--text-sub); border-radius: 50%; animation: typingBounce 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce { 0%,60%,100%{ transform:translateY(0) } 30%{ transform:translateY(-5px) } }

/* Input area */
.msg-input-area {
    padding: 12px 16px;
    background: var(--card);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
}
.msg-form { display: flex; align-items: center; gap: 8px; }
.msg-input {
    flex: 1;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    outline: none;
    font-size: 14px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
    height: auto;
    box-shadow: none;
}
.msg-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(91,75,248,0.1); }
.send-btn {
    width: 40px; height: 40px;
    border: none;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
}
.send-btn:hover { background: var(--primary-hov); }

/* ── DARK MODE ───────────────────────────────────────── */
body.dark-mode .convo-panel { background: var(--card); border-color: var(--border); }
body.dark-mode .convo-header { border-color: var(--border); }
body.dark-mode .convo-header p { color: var(--text-sub); }
body.dark-mode .convo-search input { background: var(--surface); border-color: var(--border); color: var(--text); }
body.dark-mode .user-search input { background: var(--surface); border-color: var(--border); color: var(--text); }
body.dark-mode .convo-item:hover { background: var(--surface); }
body.dark-mode .convo-item.active { background: var(--surface); }
body.dark-mode .convo-name { color: var(--text); }
body.dark-mode .chat-panel { background: var(--bg); }
body.dark-mode .chat-header { background: var(--card); border-color: var(--border); }
body.dark-mode .chat-user-info h2 { color: var(--text); }
body.dark-mode .task-banner { background: var(--surface); border-color: var(--border); }
body.dark-mode .task-banner-info .task-name { color: var(--text); }
body.dark-mode .message.received { background: var(--card); border-color: var(--border); color: var(--text); }
body.dark-mode .typing-indicator { background: var(--card); border-color: var(--border); }
body.dark-mode .msg-input-area { background: var(--card); border-color: var(--border); }
body.dark-mode .msg-input { background: var(--surface); border-color: var(--border); color: var(--text); }
body.dark-mode .chat-action-btn { border-color: var(--border); color: var(--text); }
body.dark-mode .chat-action-btn:hover { border-color: var(--primary); color: var(--primary); }
body.dark-mode .avatar .online-dot { border-color: var(--card); }

.chat-back { display: none; }
.chat-panel, #chatView, .convo-panel { min-width: 0; min-height: 0; }
.msg-input { min-width: 0; }
@media (max-width: 860px) {
    .messages-layout { grid-template-columns: minmax(0, 1fr); height: calc(100dvh - 112px - env(safe-area-inset-bottom)); }
    .convo-panel { display: flex; border-right: 0; }
    .chat-panel { display: none; }
    .messages-layout.is-chat-open .convo-panel { display: none; }
    .messages-layout.is-chat-open .chat-panel { display: flex; }
    .chat-back { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); }
    .chat-header { flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
    .chat-header-actions { width: 100%; justify-content: flex-end; }
    .msg-input-area { padding: 8px 12px; }
    .msg-input, .user-search input, .convo-search input { font-size: 16px; min-height: 44px; }
    .user-result { min-height: 44px; }
    .user-results { flex-shrink: 0; }
}
    </style>
</head>
<body>
    <div id="shared-navigation"></div>
    <div class="messages-layout">
        <aside class="convo-panel" id="convoPanel">
            <div class="convo-header">
                <h1>Messages</h1>
                <p>Your conversations</p>
            </div>
            <div class="convo-search">
                <input type="text" id="convoSearch" placeholder="Search conversations..." oninput="renderConvoList(this.value)">
            </div>
            <div class="user-search">
                <input type="search" id="userSearch" placeholder="Find a user to message..." oninput="searchUsers()">
            </div>
            <div class="user-results" id="userResults"></div>
            <div class="convo-list" id="convoList"></div>
        </aside>

        <main class="chat-panel" id="chatPanel">
            <div class="chat-empty" id="chatEmpty">
                <strong>Select a conversation</strong>
                <span style="font-size:13px">Choose someone from the left to start chatting.</span>
            </div>
            <div id="chatView" style="display:none;flex-direction:column;height:100%">
                <div class="chat-header">
                    <button class="chat-back" type="button" onclick="showConversationList()" aria-label="Back to conversations">&#8592; Back</button>
                    <div class="avatar" id="chatAvatar" style="cursor:default">A</div>
                    <div class="chat-user-info">
                        <h2 id="chatName">Conversation</h2>
                        <span class="online-label" id="chatStatus">Online</span>
                    </div>
                    <div class="chat-header-actions">
                        <button class="chat-action-btn" onclick="viewTaskDetails()">View Task</button>
                        <button class="chat-action-btn" onclick="goToMyTasks()">My Tasks</button>
                    </div>
                </div>
                <div class="task-banner" id="taskBanner">
                    <div class="task-banner-info">
                        <div class="task-label">Task</div>
                        <div class="task-name" id="chatTaskName">No task selected</div>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
                <div class="msg-input-area">
                    <form class="msg-form" onsubmit="sendMessage(event)">
                        <textarea class="msg-input" id="msgInput" rows="1" aria-label="Message" placeholder="Type a message…" onkeydown="if(event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); this.form.requestSubmit(); }"></textarea>
                        <button type="button" class="paste-btn" onclick="pasteMessage()" aria-label="Paste text into message">Paste</button>
                        <button type="submit" class="send-btn" id="sendBtn" title="Send" aria-label="Send">Send</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        /* ── STATE ──────────────────────────────────────────── */
        const MESSAGE_API  = `${window.TASKHERO_API_BASE}/messages`;
        const USERS_API    = `${window.TASKHERO_API_BASE}/users`;
        const CONVERSATIONS = [];   // filled by loadConversations()
        let activeConvo     = null; // currently open conversationId
        let messageCache = new Map();
        let messageSignature = "";
        let messageMenuId = null;
        let reactionBusy = false;

        /* ── HELPERS ────────────────────────────────────────── */
        function escHtml(str) {
            return String(str)
                .replace(/&/g,"&amp;").replace(/</g,"&lt;")
                .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
        }

        function fmtTime(iso) {
            return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }

        function fmtDate(iso) {
            const d = new Date(iso);
            const today = new Date();
            if (d.toDateString() === today.toDateString()) return fmtTime(iso);
            return d.toLocaleDateString([], { month: "short", day: "numeric" });
        }

        /* ── CONVERSATION LIST ──────────────────────────────── */
        // FIX #6 & #7: single renderConvoList used by both the
        // conversation-search input (oninput) and all internal callers.
        function renderConvoList(filter = "") {
            const list  = document.getElementById("convoList");
            const query = filter.toLowerCase();
            const filtered = CONVERSATIONS.filter(c =>
                c.participant.name.toLowerCase().includes(query) ||
                (c.lastMessage || "").toLowerCase().includes(query) ||
                (c.taskTitle   || "").toLowerCase().includes(query)
            );
            if (!filtered.length) {
                list.innerHTML = `<div style="padding:28px 16px;color:var(--text-sub);font-size:13px;text-align:center">No conversations yet.</div>`;
                return;
            }
            list.innerHTML = filtered.map(c => {
                const avatarContent = c.participant.avatar && c.participant.avatar.length > 2
                    ? `<img src="${escHtml(c.participant.avatar)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" alt="">`
                    : escHtml((c.participant.avatar || c.participant.name.charAt(0)).toUpperCase());
                return `<div class="convo-item ${activeConvo === c.conversationId ? "active" : ""}"
                              onclick="openConvo('${c.conversationId}')">
                    <div class="avatar">${avatarContent}</div>
                    <div class="convo-meta">
                        <div class="convo-top">
                            <span class="convo-name">${escHtml(c.participant.name)}</span>
                            <span class="convo-time">${c.lastMessageAt ? fmtDate(c.lastMessageAt) : ""}</span>
                        </div>
                        <div class="convo-preview">${escHtml(c.lastMessage || "No messages yet")}</div>
                    </div>
                    ${c.unread ? `<div class="unread-badge">${c.unread}</div>` : ""}
                </div>`;
            }).join("");
        }

        async function loadConversations() {
            const user = currentUser();
            if (!user) return;
            try {
                const res    = await fetch(`${MESSAGE_API}/conversations/${encodeURIComponent(user.id)}`);
                const result = await res.json();
                if (!res.ok || !result.success) throw new Error(result.message || "Unable to load conversations.");
                CONVERSATIONS.splice(0, CONVERSATIONS.length, ...result.data);
                renderConvoList(document.getElementById("convoSearch").value);
            } catch (err) {
                document.getElementById("convoList").innerHTML =
                    `<div style="padding:28px 16px;color:var(--danger);font-size:13px;text-align:center">${escHtml(err.message)}</div>`;
            }
        }

        /* ── USER SEARCH (start new conversation) ───────────── */
        async function loadUsers() {
            return true;
        }

        async function searchUsers() {
            const query   = document.getElementById("userSearch").value.trim().toLowerCase();
            const results = document.getElementById("userResults");
            if (!query) { results.innerHTML = ""; return; }
            results.innerHTML = `<div style="padding:6px 0;color:var(--text-sub);font-size:12px">Searching…</div>`;
            try {
                const response = await fetch(`${USERS_API}/search?q=${encodeURIComponent(query)}`);
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || "Unable to search users.");
                if (document.getElementById("userSearch").value.trim().toLowerCase() !== query) return;
                const user = currentUser();
                const matches = result.data.filter((member) => !user || member.id !== user.id);
                renderUserResults(matches, results);
            } catch (error) {
                results.innerHTML = `<div style="padding:6px 0;color:var(--danger);font-size:12px">${escHtml(error.message)}</div>`;
            }
        }

        function renderUserResults(matches, results) {
            results.innerHTML = matches.length
                ? matches.map(m => {
                    const av = m.avatar && m.avatar.length > 2
                        ? `<img src="${escHtml(m.avatar)}" style="width:28px;height:28px;border-radius:50%;object-fit:cover" alt="">`
                        : escHtml((m.avatar || m.name.charAt(0)).toUpperCase());
                    return `<button class="user-result" type="button" onclick="startConversation('${m.id}')">
                        <span class="user-result-avatar">${av}</span>
                        <span>
                            <span class="user-result-name">${escHtml(m.name)}</span>
                            <span class="user-result-email">${escHtml(m.tagline || m.location || "")}</span>
                        </span>
                    </button>`;
                }).join("")
                : `<div style="padding:6px 0;color:var(--text-sub);font-size:12px">No users found.</div>`;
        }

        // FIX #4: after loadConversations() data is keyed as conversationId.
        // The API returns the new/existing conversation with .id — we resolve
        // that id to conversationId after the reload.
        async function startConversation(recipientId) {
            const user = currentUser();
            if (!user) return;
            try {
                const res    = await fetch(`${MESSAGE_API}/conversations`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ initiatorId: user.id, recipientId }),
                });
                const result = await res.json();
                if (!res.ok || !result.success) throw new Error(result.message || "Unable to start conversation.");
                document.getElementById("userSearch").value  = "";
                document.getElementById("userResults").innerHTML = "";
                // The returned id is the conversation id — reload list then open it
                const convId = result.data.id;
                await loadConversations();
                await openConvo(convId);
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        /* ── OPEN A CONVERSATION ────────────────────────────── */
        async function openConvo(id) {
            const user = currentUser();
            if (!user) return;

            // Find convo by conversationId (API shape) — also handle bare .id
            const convo = CONVERSATIONS.find(c => c.conversationId === id || c.id === id);
            if (!convo) { showToast("Conversation not found.", "error"); return; }

            activeConvo = convo.conversationId || convo.id;
            renderConvoList(document.getElementById("convoSearch").value);

            // Update header
            const avatarEl = document.getElementById("chatAvatar");
            avatarEl.innerHTML = convo.participant.avatar && convo.participant.avatar.length > 2
                ? `<img src="${escHtml(convo.participant.avatar)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" alt="">`
                : escHtml((convo.participant.avatar || convo.participant.name.charAt(0)).toUpperCase());

            document.getElementById("chatName").innerText = convo.participant.name;
            document.getElementById("chatStatus").innerText = "Active member";
            document.getElementById("chatStatus").style.color = "var(--text-sub)";

            const budget = convo.taskBudget ? ` — ₱${Number(convo.taskBudget).toLocaleString()}` : "";
            document.getElementById("chatTaskName").innerText = (convo.taskTitle || "Direct conversation") + budget;

            // Show chat panel
            document.getElementById("chatEmpty").style.display  = "none";
            document.getElementById("chatView").style.display   = "flex";
            document.querySelector(".messages-layout").classList.add("is-chat-open");

            // Fetch messages
            try {
                const res    = await fetch(`${MESSAGE_API}/conversations/${encodeURIComponent(user.id)}/${encodeURIComponent(activeConvo)}`);
                const result = await res.json();
                if (!res.ok || !result.success) throw new Error(result.message || "Unable to load messages.");
                renderMessages(result.data);
                document.getElementById("msgInput").focus();
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        /* ── RENDER MESSAGES ────────────────────────────────── */
        function renderMessages(messages, preserveScroll = false) {
            const container = document.getElementById("chatMessages");
            const signature = JSON.stringify([activeConvo, messages]);
            if (preserveScroll && signature === messageSignature) return;
            messageSignature = signature;
            messageCache = new Map(messages.map((message) => [message.id, message]));
            if (messageMenuId && !messageCache.has(messageMenuId)) closeMessageMenu();
            const wasNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
            if (!messages.length) {
                container.innerHTML = `<div class="date-separator">No messages yet</div>`;
                return;
            }
            // Group by date to insert date separators
            let lastDate = null;
            const html = messages.map(msg => {
                const msgDate  = new Date(msg.createdAt).toDateString();
                const sep = msgDate !== lastDate
                    ? `<div class="date-separator">${msgDate === new Date().toDateString() ? "Today" : new Date(msg.createdAt).toLocaleDateString([], { weekday:"long", month:"short", day:"numeric" })}</div>`
                    : "";
                lastDate = msgDate;
                const message = `<div class="message ${msg.isMe ? "sent" : "received"}" tabindex="0" aria-haspopup="dialog" aria-label="Message from ${escHtml(msg.senderName || 'member')}: ${escHtml(msg.text)}. Hold or press Enter for options">${escHtml(msg.text)}<span class="msg-time">${fmtTime(msg.createdAt)}</span></div>`;
                const reactions = (msg.reactions || []).map((r) => `<button type="button" aria-label="${escHtml(r.emoji)} reaction, ${r.count}" aria-pressed="${r.reactedByMe}" onclick="reactToMessage('${msg.id}', '${escHtml(r.emoji)}')">${escHtml(r.emoji)} ${r.count}</button>`).join("");
                return sep + `<div class="message-row ${msg.isMe ? "sent" : "received"}" data-message-id="${msg.id}"><div class="message-stack">${message}<div class="message-reactions">${reactions}</div><button class="message-more" type="button" aria-label="Message options" aria-haspopup="dialog" onclick="openMessageMenu('${msg.id}', this)">&#8943;</button></div></div>`;
            }).join("");
            container.innerHTML = html;
            if (!preserveScroll || wasNearBottom) container.scrollTop = container.scrollHeight;
        }

        let messageMenu;
        let messageMenuAnchor;
        let pressTimer;
        let pressOrigin;

        function closeMessageMenu(restoreFocus = false) {
            if (messageMenu) messageMenu.hidden = true;
            messageMenuId = null;
            if (restoreFocus && messageMenuAnchor?.isConnected) messageMenuAnchor.focus({ preventScroll: true });
        }

        function openMessageMenu(messageId, anchor) {
            if (!messageCache.has(messageId)) return;
            clearTimeout(pressTimer);
            if (!messageMenu) {
                messageMenu = document.createElement("div");
                messageMenu.className = "message-context-menu";
                messageMenu.setAttribute("role", "dialog");
                messageMenu.setAttribute("aria-label", "Message options");
                document.body.append(messageMenu);
            }
            messageMenuId = messageId;
            messageMenuAnchor = anchor.closest(".message-row").querySelector(".message");
            messageMenu.replaceChildren();
            const reactions = document.createElement("div");
            reactions.className = "reaction-picker";
            reactions.setAttribute("role", "group");
            reactions.setAttribute("aria-label", "Choose a reaction");
            for (const emoji of ["\u{1f44d}", "\u2764\ufe0f", "\u{1f602}", "\u{1f62e}", "\u{1f622}", "\u{1f64f}"]) {
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = emoji;
                button.setAttribute("aria-label", `React ${emoji}`);
                button.setAttribute("aria-pressed", String((messageCache.get(messageId).reactions || []).some((r) => r.emoji === emoji && r.reactedByMe)));
                button.onclick = () => { reactToMessage(messageId, emoji); closeMessageMenu(true); };
                reactions.append(button);
            }
            messageMenu.append(reactions);
            for (const [label, action] of [["Copy", copyMessage], ["Delete for me", deleteMessage]]) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "message-menu-action" + (label.startsWith("Delete") ? " message-menu-delete" : "");
                button.textContent = label;
                button.onclick = () => { action(messageId); closeMessageMenu(true); };
                messageMenu.append(button);
            }
            messageMenu.hidden = false;
            positionMessageMenu();
            if (!matchMedia("(pointer: coarse)").matches) messageMenu.querySelector("button").focus({ preventScroll: true });
        }

        function positionMessageMenu() {
            if (!messageMenuId || !messageMenuAnchor?.isConnected) return;
            const rect = messageMenuAnchor.getBoundingClientRect();
            const width = messageMenu.offsetWidth, height = messageMenu.offsetHeight;
            messageMenu.style.left = `${Math.max(12, Math.min(innerWidth - width - 12, rect.left + rect.width / 2 - width / 2))}px`;
            const preferredTop = rect.top - height - 8 >= 64 ? rect.top - height - 8 : rect.bottom + 8;
            messageMenu.style.top = `${Math.max(64, Math.min(innerHeight - height - 76, preferredTop))}px`;
        }

        const messageArea = document.getElementById("chatMessages");
        function cancelMessageHold() { clearTimeout(pressTimer); pressOrigin = null; }
        messageArea.addEventListener("pointerdown", (event) => {
            cancelMessageHold();
            const bubble = event.target.closest(".message");
            if (!bubble || event.pointerType === "mouse" || !event.isPrimary) return;
            const row = bubble.closest("[data-message-id]");
            if (!row) return;
            pressOrigin = { x: event.clientX, y: event.clientY, id: event.pointerId };
            pressTimer = setTimeout(() => { pressOrigin = null; openMessageMenu(row.dataset.messageId, bubble); }, 500);
        });
        messageArea.addEventListener("pointermove", (event) => {
            if (pressOrigin && (event.pointerId !== pressOrigin.id || Math.hypot(event.clientX - pressOrigin.x, event.clientY - pressOrigin.y) > 10)) cancelMessageHold();
        });
        document.addEventListener("pointerup", cancelMessageHold);
        document.addEventListener("pointercancel", cancelMessageHold);
        messageArea.addEventListener("contextmenu", (event) => {
            const bubble = event.target.closest(".message");
            const row = bubble?.closest("[data-message-id]");
            if (row) { event.preventDefault(); openMessageMenu(row.dataset.messageId, bubble); }
        });
        messageArea.addEventListener("keydown", (event) => {
            if (!event.target.matches(".message")) return;
            if (event.key === "Enter" || event.key === "ContextMenu" || (event.shiftKey && event.key === "F10")) {
                event.preventDefault(); openMessageMenu(event.target.closest("[data-message-id]").dataset.messageId, event.target);
            }
        });
        document.addEventListener("pointerdown", (event) => {
            if (messageMenuId && !messageMenu.contains(event.target)) closeMessageMenu();
        });
        document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeMessageMenu(true); });
        messageArea.addEventListener("scroll", () => { cancelMessageHold(); closeMessageMenu(); }, { passive: true });
        window.addEventListener("resize", positionMessageMenu);


        async function reactToMessage(messageId, emoji) {
            if (reactionBusy) return;
            const message = messageCache.get(messageId);
            if (!message) return;
            reactionBusy = true;
            const alreadyReacted = (message.reactions || []).some((r) => r.emoji === emoji && r.reactedByMe);
            try {
                const response = await fetch(`${MESSAGE_API}/${encodeURIComponent(messageId)}/reaction`, {
                    method: "PUT", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ emoji: alreadyReacted ? null : emoji }),
                });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || "Unable to save reaction.");
                closeMessageMenu();
                await refreshActiveConversation();
            } catch (error) { showToast(error.message, "error"); }
            finally { reactionBusy = false; }
        }

        async function copyMessage(messageId) {
            const text = messageCache.get(messageId)?.text;
            if (text === undefined) return;
            try {
                await navigator.clipboard.writeText(text);
                showToast("Message copied.", "success");
            } catch {
                const field = document.createElement("textarea");
                field.value = text; field.style.cssText = "position:fixed;top:0;left:0;opacity:0";
                document.body.append(field); field.select();
                let copied = false;
                try { copied = document.execCommand("copy"); } catch (_) {}
                field.remove();
                showToast(copied ? "Message copied." : "Select the message text and use Copy.", copied ? "success" : "info");
            }
        }

        async function pasteMessage() {
            const input = document.getElementById("msgInput");
            try {
                const text = await navigator.clipboard.readText();
                input.setRangeText(text, input.selectionStart, input.selectionEnd, "end");
                input.focus();
            } catch {
                input.focus();
                showToast("Long-press the message box and choose Paste, or press Ctrl+V.", "info", 5000);
            }
        }

        async function refreshActiveConversation() {
            if (!activeConvo) return;
            const user = currentUser();
            if (!user) return;
            try {
                const response = await fetch(`${MESSAGE_API}/conversations/${encodeURIComponent(user.id)}/${encodeURIComponent(activeConvo)}`);
                const result = await response.json();
                if (response.ok && result.success) renderMessages(result.data, true);
                await loadConversations();
            } catch (_) {
                // Polling failures should not interrupt typing or show repeated toasts.
            }
        }

        async function deleteMessage(messageId) {
            const user = currentUser();
            if (!user || !activeConvo) return;
            try {
                const response = await fetch(`${MESSAGE_API}/${encodeURIComponent(messageId)}`, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: user.id }),
                });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || "Unable to delete message.");
                await refreshActiveConversation();
            } catch (error) {
                showToast(error.message, "error");
            }
        }

        /* ── SEND MESSAGE ────────────────────────────────────── */
        // FIX #5: append an optimistic bubble immediately so there's no
        // flicker. Then POST in the background and silently resync.
        async function sendMessage(event) {
            event.preventDefault();
            const input  = document.getElementById("msgInput");
            const text   = input.value.trim();
            const user   = currentUser();
            if (!text || !activeConvo || !user) return;

            const btn = document.getElementById("sendBtn");
            btn.disabled = true;
            input.value  = "";

            // 1. Append optimistic bubble right away
            const container = document.getElementById("chatMessages");
            const now    = new Date().toISOString();
            const bubble = document.createElement("div");
            bubble.className = "message sent";
            bubble.innerHTML = `${escHtml(text)}<span class="msg-time">${fmtTime(now)}</span>`;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;

            // 2. POST to API
            try {
                const res    = await fetch(MESSAGE_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ conversationId: activeConvo, senderId: user.id, text }),
                });
                const result = await res.json();
                if (!res.ok || !result.success) {
                    // Remove optimistic bubble and show error
                    bubble.remove();
                    showToast(result.message || "Unable to send message.", "error");
                    input.value = text; // restore text
                    return;
                }
                // 3. Silent background resync (replace optimistic bubble with real data)
                const msgRes    = await fetch(`${MESSAGE_API}/conversations/${encodeURIComponent(user.id)}/${encodeURIComponent(activeConvo)}`);
                const msgResult = await msgRes.json();
                if (msgResult.success) {
                    renderMessages(msgResult.data);
                    // Update conversation list preview without re-rendering the whole chat
                    await loadConversations();
                }
            } catch (err) {
                bubble.remove();
                showToast(err.message || "Network error.", "error");
                input.value = text;
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        /* ── MISC ACTIONS ────────────────────────────────────── */
        function showConversationList() {
            document.querySelector(".messages-layout").classList.remove("is-chat-open");
            document.getElementById("convoSearch").focus();
        }

        function goToMyTasks() { myTasks(); }

        function viewTaskDetails() {
            const convo = CONVERSATIONS.find(c => c.conversationId === activeConvo);
            if (convo && convo.taskTitle) showToast(`Task: ${convo.taskTitle}`, "info");
        }

        /* ── INIT ────────────────────────────────────────────── */
        document.addEventListener("DOMContentLoaded", async function () {
            await loadUsers();
            await loadConversations();
            const recipientId = new URLSearchParams(window.location.search).get("recipientId");
            if (recipientId && currentUser()) await startConversation(recipientId);
            window.setInterval(refreshActiveConversation, 2000);
        });
    </script>
</body>
</html>
